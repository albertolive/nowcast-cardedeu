name: "🩺 Prediction freshness watchdog"

# Independent backstop for the Cloudflare Worker that schedules predictions.
# If the Worker dies, its PAT expires, or `predict_now.py` starts failing
# silently, this catches it within ~hour and Telegrams. The watchdog runs
# on GH Actions cron deliberately — different platform from the trigger,
# so a CF-side outage can't take this down too.
#
# Three checks:
#  1. Freshness — output age (catches predict failures).
#  2. Dispatch heartbeat — counts workflow_dispatch runs started in the last
#     80 min via the Actions API. The CF Worker fires predict every 10 min,
#     so < 6 runs means dispatches are missing (Worker cron dead, PAT
#     expired, rate-limited) — invisible everywhere else because a run
#     that never started leaves no trace in Actions history.
#  3. Radar blindness — both radar sources down at once.
#
# Cron drift on hourly is negligible (a few minutes), so the 30-min
# staleness threshold gives plenty of margin against false positives.

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  STALE_THRESHOLD_MIN: 30

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check latest_prediction.json freshness
        id: freshness
        # TZ matters: predict_now.py writes naive timestamps in Europe/Madrid
        # local time. GH runners default to UTC, so without this override
        # `datetime.now()` would be 1–2 h behind and ages would go negative.
        env:
          TZ: Europe/Madrid
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/data/latest_prediction.json" \
            -o latest.json
          AGE_MIN=$(python3 - <<'PY'
          import json, datetime
          with open("latest.json") as f:
              data = json.load(f)
          ts = datetime.datetime.fromisoformat(data["timestamp"])
          now = datetime.datetime.now(tz=ts.tzinfo) if ts.tzinfo else datetime.datetime.now()
          age_min = (now - ts).total_seconds() / 60
          print(f"{age_min:.0f}")
          PY
          )
          echo "age_min=${AGE_MIN}" >> "$GITHUB_OUTPUT"
          echo "Latest prediction is ${AGE_MIN} min old (threshold: ${STALE_THRESHOLD_MIN})"
          if [ "${AGE_MIN}" -gt "${STALE_THRESHOLD_MIN}" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Check radar sources health
        id: radar
        # Cegues totals: RainViewer congelat (frames idèntics amb timestamps
        # nous) I radar AEMET caigut (429) alhora — vist el 2026-06-04. Les
        # regles físiques queden sense cap font de radar i la predicció vola
        # sense instruments. Només alerta quan fallen TOTES DUES (una de sola
        # té backup); es repeteix cada hora mentre duri, que és el que toca.
        run: |
          set -euo pipefail
          BLIND=$(python3 - <<'PY'
          import json
          with open("latest.json") as f:
              data = json.load(f)
          rv_frozen = bool((data.get("radar") or {}).get("frames_frozen"))
          aemet_down = not (data.get("aemet_radar") or {}).get("available", False)
          print("true" if (rv_frozen and aemet_down) else "false")
          PY
          )
          echo "blind=${BLIND}" >> "$GITHUB_OUTPUT"
          echo "Radar sources blind: ${BLIND}"
          if [ "${BLIND}" = "true" ]; then
            exit 1
          fi

      - name: Check prediction-commit heartbeat
        id: heartbeat
        # UPDATED 2026-08-30: GCP e2-micro nowcast-vm (esdeveniments:us-east1-b) runs predict every 10min and pushes data/latest_prediction.json.
        # Old CF Worker dispatch count would always be 0 and falsely alert. Count commits touching state file instead - same guarantee: missing ticks leave no trace except absence of commits, freshness masks slow leak.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SINCE=$(date -u -d '80 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/commits?sha=main&path=data/latest_prediction.json&since=${SINCE}&per_page=100" --jq 'length')
          echo "Prediction commits since ${SINCE}: ${COUNT}"
          if [ "${COUNT}" -lt 6 ]; then
            echo "gap=true" >> "$GITHUB_OUTPUT"
            echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Telegram alert on dispatch gap
        if: failure() && steps.heartbeat.outputs.gap == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COUNT: ${{ steps.heartbeat.outputs.count }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode=HTML \
            -d text="⚠️ <b>Nowcast GAP</b>: només <b>${COUNT}</b> commits de predicció en 80 min (n'esperem ~8, mínim 6).%0AEl VM GCP nowcast-vm o el seu GIT_TOKEN poden haver fallat.%0A<a href='${{ github.server_url }}/${{ github.repository }}/actions/workflows/nowcast.yml'>Veure flux predict</a>"

      - name: Telegram alert on blind radar
        if: failure() && steps.radar.outputs.blind == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode=HTML \
            -d text="🟠 <b>Nowcast CEC</b>: les dues fonts de radar han fallat alhora.%0A• RainViewer: frames congelats%0A• Radar AEMET: no disponible (429?)%0ALes regles físiques no veuen res; la predicció es basa només en NWP/llamps/estació.%0A<a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Veure logs</a>"

      - name: Telegram alert on staleness
        if: failure() && steps.freshness.outputs.stale == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AGE_MIN: ${{ steps.freshness.outputs.age_min }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode=HTML \
            -d text="⚠️ <b>Nowcast STALE</b>: <code>latest_prediction.json</code> és de fa <b>${AGE_MIN} min</b> (llindar ${STALE_THRESHOLD_MIN} min).%0AEl VM GCP nowcast-vm o el job <code>predict</code> s'ha aturat.%0A<a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Veure logs</a>"
